[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "face-recognition-lite"
version = "0.1.0"
description = "Versioned face embeddings and open-set identification for the X2 Ultra prototype"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.2.6",
  "opencv-python-headless==4.12.0.88",
  "Pillow==11.3.0",
  "psutil==7.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "build==1.3.0"]

[project.scripts]
face-lite = "face_lite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires downloaded official models and ORL images"]

